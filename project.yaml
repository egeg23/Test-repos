# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-10-19

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/settings --local <key>=<value>` writes there; `/settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

# ─── DevUz: Roblox ──────────────────────────────────────────────────────────
# Владелец, 08.11.2026: «для игр всегда используем Claude Code Game Studios…
# разверни его для всех игровых проектов наших… для роблокс».
# В этом репозитории две игры Roblox. Активная — та, на которую указывает
# engine.code_root; вторую включают строкой в project.local.yaml:
#   engine:
#     code_root: "roblox-school/src"
# Остальное в корне (бот на Python и т. д.) к студии не относится.

project:
  name: "Сквиш-фабрика"
  genre: "Collect / steal / defend (tycoon)"
  version: "0.1.0"
  stage: Production          # код и тесты уже есть — заходить через /adopt
  kind: game

platform:
  multiplayer: true          # сервер Roblox, кража у других игроков
  online: true               # DataStore/ProfileStore, Robux, лидерборды
  targets: [PC, Mobile, Console]
  primary_input: "Touch"     # большая часть игроков Roblox — телефон
  gamepad_support: "Partial"
  touch_support: "Full"
  cert_tier: none            # модерация и правила Roblox — см. roblox-specialist

engine:
  name: "Roblox"             # DevUz: свой движок в yaml-helper.sh (resolve_code_root)
  version: "Roblox Studio (live), Rojo 7.7.0, Wally 0.3.2"
  language: "Luau"
  rendering: "Roblox (Future lighting по умолчанию)"
  physics: "Roblox (сервер — хозяин физики сетевых тел)"
  code_root: "roblox-squish/src"   # активная игра; вторая — roblox-school/src

specialists:
  code: "roblox-specialist"
  shader: null               # шейдеров в Roblox нет
  ui: "roblox-specialist"
  additional: []

naming:
  classes: PascalCase        # модули-сервисы и контроллеры: BoxService.luau
  variables: camelCase
  constants: SCREAMING_SNAKE
  signals: PascalCase        # RemoteEvent / BindableEvent: BoxOpened
  files: PascalCase          # Rojo: имя файла = имя Instance
  scenes: PascalCase

testing:
  framework: luau-standalone # roblox-squish/tools/test.sh: настоящий luau, без Studio

commands:
  build: "cd roblox-squish && rojo build default.project.json -o build/squish.rbxl"
  test:  "bash roblox-squish/tools/test.sh"
  run:   "cd roblox-squish && rojo serve"   # и подключиться плагином Rojo в Studio
  smoke: "bash roblox-squish/tools/check_all.sh"
